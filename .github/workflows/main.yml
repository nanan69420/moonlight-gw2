name: Build GW2Moonlight APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37" "ndk;29.0.14206865"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleNonRootDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GW2Moonlight-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
